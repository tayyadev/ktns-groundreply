[project]
name = "ktns-groundreply"
version = "0.1.0"
description = "Human-approved multi-tenant AI support desk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "pydantic[email]>=2.10,<3",
  "argon2-cffi>=23.1,<27",
  "PyJWT>=2.10,<3",
  "openai>=1.75,<3",
  "stripe>=12,<20",
  "httpx>=0.28,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 105
target-version = "py312"
