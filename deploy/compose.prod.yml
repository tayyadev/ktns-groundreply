name: groundreply-production
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundreply
      POSTGRES_USER: groundreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundreply -d groundreply"]
      interval: 5s
      timeout: 4s
      retries: 15
    networks: [private]
  migrate:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundreply:${POSTGRES_PASSWORD:?Set secure POSTGRES_PASSWORD}@db:5432/groundreply
      APP_ORIGIN: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      COOKIE_SECURE: 'true'
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: 'no'
    networks: [private]
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundreply:${POSTGRES_PASSWORD:?Set secure POSTGRES_PASSWORD}@db:5432/groundreply
      APP_ORIGIN: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      COOKIE_SECURE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    networks: [private]
  worker:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundreply:${POSTGRES_PASSWORD:?Set secure POSTGRES_PASSWORD}@db:5432/groundreply
      APP_ORIGIN: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      COOKIE_SECURE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 120s
    networks: [private]
  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [api]
    networks: [private]
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [private]
networks:
  private:
volumes:
  prod_pgdata:
  caddy_data:
  caddy_config:
